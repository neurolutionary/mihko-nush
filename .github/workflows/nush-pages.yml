name: Mihko NUSH checks
on:
  push:
    branches: [main]
    paths: ['nush/**', 'tools/nush/**', 'tests/nush.test.cjs', '.github/workflows/nush-pages.yml']
  pull_request:
    paths: ['nush/**', 'tools/nush/**', 'tests/nush.test.cjs', '.github/workflows/nush-pages.yml']
  workflow_dispatch:
concurrency:
  group: mihko-nush-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Перевірити картки та межі публікації
        run: node --test tests/nush.test.cjs
      - name: Зібрати сторінку НУШ
        run: node tools/nush/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mihko-nush-preview
          path: dist/nush-pages/
          include-hidden-files: true
