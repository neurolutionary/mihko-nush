name: Mihko NUSH Pages
on:
  push:
    branches: [main]
    paths: ['nush/**', 'tools/nush/**', 'tests/nush.test.cjs', '.github/workflows/nush-pages.yml']
  pull_request:
    paths: ['nush/**', 'tools/nush/**', 'tests/nush.test.cjs', '.github/workflows/nush-pages.yml']
  workflow_dispatch:
concurrency:
  group: mihko-nush-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Перевірити картки та межі публікації
        run: node --test tests/nush.test.cjs
      - name: Зібрати сторінку НУШ
        run: node tools/nush/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mihko-nush-preview
          path: dist/nush-pages/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/nush-pages/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
